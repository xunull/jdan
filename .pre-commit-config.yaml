# 提交前防泄密：用 gitleaks 扫描暂存区，发现 API key / 密码 / token / 私钥
# 就阻止提交。密钥一旦进入 git 历史，即使删掉也必须当作已泄露来轮换，代价
# 高得多；提交前这道闸是最划算的防线。
#
# 新 clone 启用一次即可：pre-commit install
# 临时放行本次提交：      SKIP=gitleaks git commit  （或 git commit --no-verify）
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
